<script>
// Electron only (window.qcDialog comes from electron/preload.js): route alert()
// through a native OS dialog instead of Chromium's own, which has a Windows-only bug
// where the renderer's inputs stop responding after the dialog closes. No-op in a plain
// browser (python -m http.server), where window.qcDialog is never defined.
// confirm() has no app callers anymore (see modals.js confirmDialog()), so it's not
// overridden here.
if (window.qcDialog) {
  window.alert = function (message) { return window.qcDialog.alert(message); };
}
</script>
