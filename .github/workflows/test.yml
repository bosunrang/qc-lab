name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # No npm install: tests/*.test.js and tests/helpers/sandbox.js depend
      # only on Node core modules (fs/path/vm/assert), not on any package in
      # node_modules. Goes through scripts/run-tests.js rather than a bare glob:
      # `node --test` exits 0 when the pattern matches nothing, so an unexpanded
      # glob would turn this job green without running a single test.
      - run: node scripts/run-tests.js

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify-release

  # Job Windows: `npm run dist` chỉ xuất NSIS Windows x64 — 100% người dùng chạy
  # Windows, trong khi ba job còn lại đều là Linux. Không phải lo hão: index.html
  # đang mang sẵn một đoạn vá cho lỗi CHỈ có trên Windows (dialog Chromium làm ô
  # nhập chết cứng sau khi đóng → alert()/confirm() đi qua dialog hệ điều hành), và
  # print-check — thứ kiểm đường in ra PDF của bản desktop — chạy Electron dưới
  # xvfb TRÊN LINUX, tức kiểm một đường mã trên hệ điều hành sản phẩm không bao giờ
  # chạy. Ở đây không cần xvfb: runner Windows có session desktop thật.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # Giữ nguyên tính chất không-cần-cài của bộ test nhanh: chạy TRƯỚC `npm ci`.
      # KHÔNG dùng glob ở đây: shell mặc định của runner Windows là PowerShell,
      # PowerShell không nở glob, nên việc nở phụ thuộc hoàn toàn vào Node — và
      # `node --test` với mẫu không khớp gì thì exit 0. Job sẽ xanh mà chạy 0 test.
      # scripts/run-tests.js tự liệt kê file và coi "0 file test" là lỗi.
      - run: node scripts/run-tests.js
      - run: npm ci
      - run: npm run print-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-print-report
          path: tests/__print__/
          if-no-files-found: ignore

  # Separate from the job above on purpose: visual-check/a11y-audit need
  # Playwright + a real Chromium download, which would slow down and add a
  # dependency-install step to the fast, install-free job every other test
  # here relies on. See CLAUDE.md "Tests".
  visual-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run visual-check
      - run: npm run a11y-audit
        if: always()
      # nce-workflow-check lái vòng đời hồ sơ NCE trong Chromium thật: form phải sống
      # sót qua rerender(), danh tính sự cố phải bất biến, chip QC chạy lại/quá hạn
      # phải khớp giữa các mục. Không đưa vào `npm test` được vì cần DOM thật.
      - run: npm run nce-check
        if: always()
      # print-check boots the real app in Electron (print-to-PDF pipeline), so
      # it needs a display on Linux — xvfb-run provides a virtual one. The
      # Electron binary itself comes with `npm ci` above.
      - run: xvfb-run -a npm run print-check
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-and-a11y-reports
          path: |
            tests/__visual__/
            tests/__a11y__/
            tests/__print__/
          if-no-files-found: ignore
