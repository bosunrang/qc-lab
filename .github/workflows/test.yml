name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # No npm install: tests/*.test.js and tests/helpers/sandbox.js depend
      # only on Node core modules (fs/path/vm/assert), not on any package in
      # node_modules.
      - run: node --test tests/*.test.js

  # Separate from the job above on purpose: visual-check/a11y-audit need
  # Playwright + a real Chromium download, which would slow down and add a
  # dependency-install step to the fast, install-free job every other test
  # here relies on. See CLAUDE.md "Tests".
  visual-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run visual-check
      - run: npm run a11y-audit
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-and-a11y-reports
          path: |
            tests/__visual__/
            tests/__a11y__/
          if-no-files-found: ignore
