<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>QC Lab Worker Smoke</title></head>
<body>
  <main><h1>Westgard worker smoke test</h1><p id="result">running</p></main>
  <script>
    const output=document.getElementById('result');
    try{
      const worker=new Worker('../assets/workers/westgard-worker.js?v=clean-text-core-20260714-1');
      const timer=setTimeout(()=>{output.textContent='error: timeout';worker.terminate();},5000);
      worker.onmessage=event=>{
        clearTimeout(timer);worker.terminate();
        const data=event.data||{},rules=data.levels&&data.levels[0]&&data.levels[0].points[0]&&data.levels[0].points[0].rules||[];
        output.textContent=data.type==='result'&&data.generation===11&&rules.includes('R4s')?'pass':'error: invalid result';
      };
      worker.onerror=event=>{clearTimeout(timer);worker.terminate();output.textContent='error: '+(event.message||'worker failed');};
      worker.postMessage({
        type:'compute',generation:11,testId:'smoke',globalRules:{'1-3s':true,R4s:true},ruleActions:{'1-3s':'reject',R4s:'reject'},
        levels:[{level:1,mean:100,sd:10,lot:'L1'},{level:2,mean:200,sd:20,lot:'L2'}],
        points:[
          {id:'a',level:1,lot:'L1',date:'2026-07-01',runId:'2026-07-01-1',val:131,qcMean:100,qcSd:10},
          {id:'b',level:2,lot:'L2',date:'2026-07-01',runId:'2026-07-01-1',val:138,qcMean:200,qcSd:20}
        ]
      });
    }catch(error){output.textContent='error: '+error.message;}
  </script>
</body>
</html>
